<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhishGuard | Phishing Message Detector</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

        body {
            font-family: 'Bangers', cursive;
            background: linear-gradient(145deg, #6bc9f2, #9bf6ff, #fefefe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffffcc;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 4px solid #3abff8;
        }

        .logo {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5rem;
            color: #2563eb;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #4b5563;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            border: 2px solid #93c5fd;
            border-radius: 12px;
            resize: none;
            transition: border-color 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        textarea:focus {
            border-color: #3b82f6;
            outline: none;
        }

        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2563eb;
        }

        .result {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
        }

        .phishing {
            background-color: #ffe4e6;
            color: #dc2626;
        }

        .legit {
            background-color: #d1fae5;
            color: #047857;
        }

        .error {
            background-color: #fef2f2;
            color: #dc2626;
            border: 2px solid #fecaca;
        }

        .confidence {
            font-size: 0.9rem;
            margin-top: 8px;
            opacity: 0.8;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Shield Fish icon (replace with your hosted URL if needed) -->
       
        <h1>PhishGuard</h1>
        <p class="subtitle">Scan messages for phishing</p>
        <form method="POST">
            <textarea name="message" rows="6" placeholder="Paste your message here..." required>{{ message }}</textarea>
            <br>
            <button type="submit">🎯 Check Message</button>
        </form>

        {% if error %}
            <div class="result error">
                {{ error }}
            </div>
        {% elif prediction %}
            <div class="result {{ 'phishing' if 'Phishing' in prediction else 'legit' }}">
                {{ prediction }}
                {% if confidence %}
                    <div class="confidence">Confidence: {{ confidence }}</div>
                {% endif %}
            </div>
        {% endif %}

        <footer>
            &copy; 2025 PhishGuard |
        </footer>
    </div>
</body>
</html>
